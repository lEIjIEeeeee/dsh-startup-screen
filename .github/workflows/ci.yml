name: CI

on:
  push:
    branches: [main, 'refactor/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # 开发机是 Windows，构建确定性和路径问题只在 Windows 上才暴露得出来。
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Committed lib/ must match build output
        shell: pwsh
        run: |
          git diff --exit-code -- lib
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # git diff 只看已跟踪文件；新增文件忘了提交时这里要能发现
          $dirty = git status --porcelain -- lib
          if ($dirty) {
            Write-Error "lib/ 未与构建产物同步：`n$dirty"
            exit 1
          }

      - name: Test
        run: npm test
